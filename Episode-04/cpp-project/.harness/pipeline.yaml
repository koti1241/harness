pipeline:
  name: cpp-enterprise-ci-pipeline
  identifier: cpp_enterprise_ci_pipeline
  projectIdentifier: MTV
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: account.Github_connector
        repoName: harness
        build: <+input>
  variables:
    - name: deploy_version
      type: String
      description: Enter deploy version (e.g. 1.0.0, 2.1.3)
      value: <+input>
    - name: environment
      type: String
      description: Select environment
      value: <+input>.allowedValues(development,testing,staging,production)
  stages:
    - stage:
        name: build-cpp
        identifier: build_cpp
        description: Enterprise CI Pipeline for C++ App
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Install Dependencies
                  identifier: install_deps
                  spec:
                    shell: Sh
                    command: |-
                      echo "=== Step 1: Installing Dependencies ==="
                      apt-get update -qq
                      apt-get install -y -qq cmake g++ make
                      echo "CMake version: $(cmake --version | head -1)"
                      echo "GCC version: $(g++ --version | head -1)"
                      echo "=== Dependencies Installed! ==="
              - step:
                  type: Run
                  name: Unit Tests
                  identifier: unit_tests
                  spec:
                    shell: Sh
                    command: |-
                      echo "=== Step 2: Running Unit Tests ==="
                      cd Episode-04/cpp-project
                      mkdir -p build && cd build
                      cmake ..
                      make tests
                      ./tests
                      echo "=== All Tests Passed! ==="
              - step:
                  type: Run
                  name: Build Application
                  identifier: build_app
                  spec:
                    shell: Sh
                    command: |-
                      echo "=== Step 3: Building C++ Application ==="
                      cd Episode-04/cpp-project
                      mkdir -p build && cd build
                      cmake ..
                      make app
                      echo "Binary size:"
                      ls -lh app
                      echo "=== Build Successful! ==="
              - step:
                  type: BuildAndPushDockerRegistry
                  name: Push to Docker Hub
                  identifier: push_dockerhub
                  spec:
                    connectorRef: docker_hub_repo
                    repo: <+variable.dockerhub_username>/cpp-harness-app
                    tags:
                      - <+pipeline.variables.deploy_version>-<+pipeline.variables.environment>
                      - <+pipeline.sequenceId>
                      - latest
                    dockerfile: Episode-04/cpp-project/Dockerfile
                    context: Episode-04/cpp-project
              - step:
                  type: Run
                  name: Verify Images
                  identifier: verify_images
                  spec:
                    shell: Sh
                    command: |-
                      echo "========================================="
                      echo "  STAGE 1 COMPLETE! (Build & Push Docker Hub)"
                      echo ""
                      echo "  Version: <+pipeline.variables.deploy_version>"
                      echo "  Environment: <+pipeline.variables.environment>"
                      echo "  Docker Hub: <+variable.dockerhub_username>/cpp-harness-app:<+pipeline.variables.deploy_version>-<+pipeline.variables.environment>"
                      echo "========================================="
              - step:
                  type: BuildAndPushGAR
                  name: Push to Google Artifact Registry
                  identifier: push_gar
                  spec:
                    connectorRef: GCP_Connector
                    host: LOCATION-docker.pkg.dev
                    projectID: project-b521915a-fd11-4b0a-97f
                    imageName: dockergar/cpp-harness-app
                    tags:
                      - <+pipeline.variables.deploy_version>-<+pipeline.variables.environment>
                      - <+pipeline.sequenceId>
                      - latest
                    dockerfile: Episode-04/cpp-project/Dockerfile
                    context: Episode-04/cpp-project
              - step:
                  type: Run
                  name: Verify GAR Image
                  identifier: verify_gar
                  spec:
                    shell: Sh
                    command: |-
                      echo "========================================="
                      echo "  GAR PUSH COMPLETE!"
                      echo ""
                      echo "  Project: project-b521915a-fd11-4b0a-97f"
                      echo "  Repository: dockergar"
                      echo "  Region: us-west1"
                      echo ""
                      echo "  Image:"
                      echo "  us-west1-docker.pkg.dev/project-b521915a-fd11-4b0a-97f/dockergar/cpp-harness-app:<+pipeline.variables.deploy_version>-<+pipeline.variables.environment>"
                      echo "========================================="

                          
