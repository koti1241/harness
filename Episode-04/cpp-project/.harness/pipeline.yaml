# ============================================
# PIPELINE: C++ Enterprise CI Pipeline (Episode 4)
# ============================================
# Flow: Clone → Install Deps → Unit Test → Build → Docker Build → Push Docker Hub → Push GCR
#
# CHANGE THESE:
#   - projectIdentifier
#   - orgIdentifier
#   - connectorRef (GitHub, Docker Hub, GCP)
# ============================================
pipeline:
  name: cpp-enterprise-ci-pipeline
  identifier: cpp_enterprise_ci_pipeline
  # CHANGE THIS: Your project ID
  projectIdentifier: MTV
  # CHANGE THIS: Your org
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        # CHANGE THIS: Your GitHub connector
        # This connector is at ACCOUNT level (Account Settings → Connectors)
        # We created this in Episode 1
        connectorRef: account.Github_connector
        repoName: harness
        build: <+input>
  # Runtime Inputs: user selects version and environment when running
  variables:
    - name: deploy_version
      type: String
      description: "Enter deploy version (e.g. 1.0.0, 2.1.3)"
      value: <+input>
    - name: environment
      type: String
      description: "Select environment"
      value: <+input>.allowedValues(development,testing,staging,production)
  stages:
    - stage:
        name: build-cpp
        identifier: build_cpp
        description: "Enterprise CI Pipeline for C++ App"
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              # Step 1: Install Dependencies
              - step:
                  type: Run
                  name: Install Dependencies
                  identifier: install_deps
                  spec:
                    shell: Sh
                    command: |-
                      echo "=== Step 1: Installing Dependencies ==="
                      apt-get update -qq
                      apt-get install -y -qq cmake g++ make
                      echo "CMake version: $(cmake --version | head -1)"
                      echo "GCC version: $(g++ --version | head -1)"
                      echo "=== Dependencies Installed! ==="

              # Step 2: Unit Tests
              - step:
                  type: Run
                  name: Unit Tests
                  identifier: unit_tests
                  spec:
                    shell: Sh
                    command: |-
                      echo "=== Step 2: Running Unit Tests ==="
                      cd Episode-04/cpp-project
                      mkdir -p build && cd build
                      cmake ..
                      make tests
                      ./tests
                      echo "=== All Tests Passed! ==="

              # Step 3: Build Application
              - step:
                  type: Run
                  name: Build Application
                  identifier: build_app
                  spec:
                    shell: Sh
                    command: |-
                      echo "=== Step 3: Building C++ Application ==="
                      cd Episode-04/cpp-project
                      mkdir -p build && cd build
                      cmake ..
                      make app
                      echo "Binary size:"
                      ls -lh app
                      echo "=== Build Successful! ==="

              # Step 4: Build and Push to Docker Hub
              - step:
                  type: BuildAndPushDockerRegistry
                  name: Push to Docker Hub
                  identifier: push_dockerhub
                  spec:
                    # CHANGE THIS: Your Docker Hub connector
                    # This connector is at PROJECT level (Project Settings → Connectors)
                    # We created this in Episode 2
                    connectorRef: docker_hub_repo
                    repo: <+variable.dockerhub_username>/cpp-harness-app
                    tags:
                      - <+pipeline.variables.deploy_version>-<+pipeline.variables.environment>
                      - <+pipeline.sequenceId>
                      - latest
                    dockerfile: Episode-04/cpp-project/Dockerfile
                    context: Episode-04/cpp-project

              # Step 5: Verify Docker Hub Push
              - step:
                  type: Run
                  name: Verify Images
                  identifier: verify_images
                  spec:
                    shell: Sh
                    command: |-
                      echo "========================================="
                      echo "  STAGE 1 COMPLETE! (Build & Push Docker Hub)"
                      echo ""
                      echo "  Version: <+pipeline.variables.deploy_version>"
                      echo "  Environment: <+pipeline.variables.environment>"
                      echo "  Docker Hub: <+variable.dockerhub_username>/cpp-harness-app:<+pipeline.variables.deploy_version>-<+pipeline.variables.environment>"
                      echo "========================================="

  # ============================================
    # STAGE 2: Push to Amazon ECR
    # ============================================
 
                          
