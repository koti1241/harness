pipeline:
  name: terraform-infra-pipeline
  identifier: terraform_infra_pipeline
  projectIdentifier: MTV
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: account.Github_connector
        repoName: harness
        build: <+input>
  variables:
    - name: tf_action
      type: String
      description: Choose Apply or Destroy
      value: <+input>.allowedValues(Plan,Apply,Destroy)
  stages:
    - stage:
        name: terraform
        identifier: terraform
        description: Plan, Apply or Destroy GCP infrastructure
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: TerraformPlan
                  name: Terraform Plan
                  identifier: tf_plan
                  when:
                    stageStatus: Success
                    condition: <+pipeline.variables.tf_action> == "Plan"
                  spec:
                    provisionerIdentifier: terraform_apply
                    configuration:
                      command: Apply
                      configFiles:
                        store:
                          type: Github
                          spec:
                            connectorRef: account.Github_connector
                            repoName: harness
                            gitFetchType: Branch
                            branch: master
                            folderPath: Episode-03/terraform-project
                      providerCredential:
                        type: Gcp
                        spec:
                          connectorRef: GCP_Connector
                          project: project-b521915a-fd11-4b0a-97f
                      secretManagerRef: harnessSecretManager
                    timeout: 10m
              - step:
                  type: TerraformApply
                  name: Terraform Apply
                  identifier: tf_apply
                  when:
                    stageStatus: Success
                    condition: <+pipeline.variables.tf_action> == "Apply"
                  spec:
                    provisionerIdentifier: terraform_apply
                    configuration:
                      type: InheritFromPlan
                    timeout: 10m
