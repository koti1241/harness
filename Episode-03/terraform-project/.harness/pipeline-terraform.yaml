# ============================================
# PIPELINE: Terraform on Harness Cloud
# Creates VPC + EC2 or Destroys everything
# ============================================
# PREREQUISITES:
#   1. S3 bucket created manually (for Terraform state)
#   2. Secrets in Harness:
#      - aws_access_key_id (AWS Access Key)
#      - aws_secret_access_key (AWS Secret Key)
#   3. Variables in Harness:
#      - s3_bucket_name (your state bucket)
#      - aws_region (us-east-1)
#
# WHY secrets needed here:
#   OIDC connector works for Harness features (deploy, etc.)
#   But Terraform CLI needs AWS_ACCESS_KEY_ID + SECRET as env vars
#   Harness Cloud Run step cannot pass OIDC token to terraform CLI
#
# HOW TO USE:
#   Run pipeline → Choose: "apply" or "destroy"
#
# CHANGE THESE:
#   - projectIdentifier
#   - orgIdentifier
#   - connectorRef (GitHub)
#   - secret names (if different)
# ============================================
pipeline:
  name: terraform-infra-pipeline
  identifier: terraform_infra_pipeline
  projectIdentifier: MTV
  orgIdentifier: default
  tags: {}

  properties:
    ci:
      codebase:
        connectorRef: account.Github_connector
        repoName: harness
        build: <+input>

  variables:
    - name: tf_action
      type: String
      description: "Choose: apply or destroy"
      value: <+input>.allowedValues(apply,destroy)

  stages:
    - stage:
        name: terraform
        identifier: terraform
        description: "Apply or Destroy GCP infrastructure"
        type: Custom

        spec:
          execution:
            steps:

              # ============================================
              # STEP 1: TERRAFORM PLAN
              # ============================================
              - step:
                  type: TerraformPlan
                  name: Terraform Plan
                  identifier: tf_plan

                  spec:
                    provisionerIdentifier: terraform

                    configuration:
                      command: <+pipeline.variables.tf_action>

                      configFiles:
                        store:
                          type: Github
                          spec:
                            connectorRef: account.Github_connector
                            repoName: harness
                            gitFetchType: Branch
                            branch: master
                            folderPath: Episode-03/terraform-project

                      providerCredential:
                        type: Gcp
                        spec:
                          connectorRef: GCP_Connector
                          project: project-b521915a-fd11-4b0a-97f

                    timeout: 10m


              # ============================================
              # STEP 2: TERRAFORM APPLY
              # ============================================
              - step:
                  type: TerraformApply
                  name: Terraform Apply
                  identifier: tf_apply

                  when:
                    stageStatus: Success
                    condition: <+pipeline.variables.tf_action> == "apply"

                  spec:
                    provisionerIdentifier: terraform

                    configuration:
                      type: InheritFromPlan
                      spec:
                        provisionerIdentifier: terraform

                    timeout: 10m


              # ============================================
              # STEP 3: TERRAFORM DESTROY
              # ============================================
              - step:
                  type: TerraformDestroy
                  name: Terraform Destroy
                  identifier: tf_destroy

                  when:
                    stageStatus: Success
                    condition: <+pipeline.variables.tf_action> == "destroy"

                  spec:
                    provisionerIdentifier: terraform

                    configuration:
                      type: InheritFromPlan
                      spec:
                        provisionerIdentifier: terraform

                    timeout: 10m
